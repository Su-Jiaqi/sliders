prompts_file: train/configs/prompts_xbd.yaml

dataset:
  root: datasets/remote/socalfire
  pre_dir: "pre"
  post_dir: "post"
  image_size: 256
  num_workers: 0

pretrained_model:
  name_or_path: "CompVis/stable-diffusion-v1-4"
  v2: false
  v_pred: false
  clip_skip: null

network:
  rank: 4
  alpha: 1.0
  training_method: "full"

train:
  precision: "bf16"
  noise_scheduler: "ddim"
  iterations: 5000
  batch_size: 1
  lr: 1e-5
  optimizer: "adamw"
  lr_scheduler: "constant"
  seed: 42

  min_timestep: 200
  max_timestep: 600

  s_warmup_steps: 800
  s_endpoint_prob: 0.7

  x0_loss_weight: 0.0
  smoothness_weight: 0.0
  smoothness_delta: 0.05

save:
  name: "xbd_paired_slider_overfit4"
  path: output-models
  per_steps: 500
  precision: "float32"

logging:
  print_every: 10
  use_wandb: false
  verbose: false

other:
  use_xformers: true
