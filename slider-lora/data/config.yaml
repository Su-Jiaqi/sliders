# trainscripts/imagesliders/data/config.yaml

# === single source of truth ===
device: "cuda:2"

# if you want to pass attributes list into prompt loader (optional)
attributes: null

# prompts file (建议用相对路径，按你运行目录而定)
prompts_file: "data/prompts.yaml"

# dataset settings (ALL data-related params live here)
data:
  folder_main: "/home/sjq/concept_sliders/datasets/remote/santarosa"
  folders: "pre,post"
  scales: "-1,1"

pretrained_model:
  name_or_path: "CompVis/stable-diffusion-v1-4"
  v2: false
  v_pred: false

network:
  type: "c3lier"
  rank: 4
  alpha: 1.0
  training_method: "noxattn"

train:
  precision: "bfloat16"
  noise_scheduler: "ddim"   # "ddpm", "lms", "euler_a" etc.
  iterations: 1000
  lr: 0.0002
  optimizer: "AdamW"
  optimizer_args: ""        # optional, e.g. "betas=(0.9,0.999) weight_decay=0.01"
  lr_scheduler: "constant"
  max_denoising_steps: 50

  # optional: discourage "two filters" cheating
  use_diff_loss: false
  lambda_diff: 0.2

save:
  name: "wildfire"
  path: "/home/sjq/concept_sliders/models/new/wildfire"  
  per_steps: 500
  precision: "bfloat16"

logging:
  use_wandb: false
  verbose: false

other:
  use_xformers: true